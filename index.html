<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveSphere | Premium Car Showcase</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0b0f17 !important;
            color: #f8fafc !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism Navbar */
        .navbar {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            margin: 20px auto;
            max-width: 92%;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: #f59e0b !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #f59e0b !important;
        }

        /* Clean Hero Section */
        .hero-section {
            padding: 90px 20px 70px 20px;
            text-align: center;
            background: linear-gradient(135deg, #0b0f17 0%, #151d30 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 60px;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .btn-explore {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
            color: #0b0f17 !important;
            font-weight: 700 !important;
            border: none !important;
            border-radius: 14px !important;
            padding: 14px 35px !important;
            font-size: 1rem !important;
            text-transform: uppercase;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-explore:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            color: #0b0f17;
        }

        /* Brand Showcase Cards */
        .brand-card {
            background: #121826 !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 20px !important;
            overflow: hidden !important;
            transition: all 0.35s ease;
            height: 270px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none !important;
            padding: 25px;
            position: relative;
        }

        .brand-card:hover {
            transform: translateY(-8px);
            border-color: rgba(245, 158, 11, 0.6) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6) !important;
        }

        .brand-logo-container {
            width: 120px;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            background: #ffffff;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .brand-card:hover .brand-logo-container {
            transform: scale(1.08);
        }

        .brand-logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff !important;
            letter-spacing: 0.5px;
        }

        footer {
            background-color: #0b0c0e;
            padding: 30px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 80px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-2 sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                🚗 DriveSphere
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-3">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#brands">Brands</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero-section">
        <div class="container">
            <h1 class="hero-title">Explore Your Dream Car</h1>
            <p class="hero-subtitle">Luxury • Performance • Innovation</p>
            <a href="#brands" class="btn btn-explore">Explore Cars</a>
        </div>
    </section>

    <!-- BRANDS GRID -->
    <section id="brands" class="container pb-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold fs-2 text-white">Choose Your Brand</h2>
            <p class="text-secondary">Select a manufacturer to explore their lineup</p>
        </div>

        <div class="row g-4 justify-content-center">
            
            <!-- Tata -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <a href="tata.html" class="brand-card">
                    <div class="brand-logo-container">
                        <img src="https://stimg2.cardekho.com/images/carNewsimages/userimages/4944/Tata.JPG" alt="Tata Logo">
                    </div>
                    <span class="brand-name">Tata</span>
                </a>
            </div>

            <!-- Kia -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <a href="kia.html" class="brand-card">
                    <div class="brand-logo-container">
                        <img src="https://ev-extras.com/cdn/shop/collections/Car_Make_Logo_0003_Kia-logo-640x321.jpg?v=1742992829" alt="Kia Logo">
                    </div>
                    <span class="brand-name">Kia</span>
                </a>
            </div>

            <!-- Hyundai -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <a href="hyundai.html" class="brand-card">
                    <div class="brand-logo-container">
                        <img src="https://cdn.freebiesupply.com/logos/thumbs/1x/hyundai-motor-company-2-logo.png" alt="Hyundai Logo">
                    </div>
                    <span class="brand-name">Hyundai</span>
                </a>
            </div>

            <!-- Honda -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <a href="honda.html" class="brand-card">
                    <div class="brand-logo-container">
                        <img src="https://static.vecteezy.com/system/resources/previews/020/336/704/large_2x/honda-logo-honda-icon-free-free-vector.jpg" alt="Honda Logo">
                    </div>
                    <span class="brand-name">Honda</span>
                </a>
            </div>

            <!-- Maruti Suzuki -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <a href="suzuki.html" class="brand-card">
                    <div class="brand-logo-container">
                        <img src="https://www.pngmart.com/files/17/Maruti-Suzuki-Logo-PNG-Photo.png" alt="Suzuki Logo">
                    </div>
                    <span class="brand-name">Suzuki</span>
                </a>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <h5 class="text-white fw-bold mb-2">🚗 DriveSphere</h5>
            <p class="mb-0">© 2026 DriveSphere. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
