<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | DriveSphere</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0b0f17 !important;
            color: #ffffff !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            margin: 20px auto;
            max-width: 95%;
        }

        .navbar-brand { font-weight: 800; font-size: 1.8rem; color: #f59e0b !important; }
        .nav-link { color: #ffffff !important; font-size: 1.2rem; font-weight: 500; }
        .nav-link:hover, .nav-link.active { color: #f59e0b !important; }

        /* Main Container setup for half-page feel */
        .contact-container {
            width: 100%;
            max-width: 900px;
            margin: 80px auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 0 20px;
        }

        .card {
            background: #121826 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 30px !important;
            padding: 50px !important;
            color: #ffffff !important;
        }

        .card h4 { color: #f59e0b; margin-bottom: 25px; font-weight: 800; font-size: 2rem; }
        .card p, .card span { color: #ffffff !important; font-size: 1.2rem; }

        .form-control {
            background-color: #1b2438 !important;
            border: 2px solid rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border-radius: 15px !important;
            padding: 20px !important;
            font-size: 1.2rem !important;
        }

        .form-control::placeholder { color: #b0bec5 !important; opacity: 1; }

        .btn-submit {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
            color: #0b0f17 !important;
            font-weight: 800 !important;
            border: none !important;
            border-radius: 15px !important;
            padding: 20px !important;
            width: 100%;
            font-size: 1.4rem;
        }

        footer { text-align: center; color: #ffffff; padding: 40px 0; }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3 sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">🚗 DriveSphere</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto gap-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="contact-container">
        
        <!-- 1. Contact Info -->
        <div class="card">
            <h4>DriveSphere Contact Info</h4>
            <p class="mb-3">📍 123, Car Showroom Road, Chennai, Tamil Nadu, 600001</p>
            <p class="mb-3">📞 +91 98765 43210</p>
            <p class="mb-4">📧 contact@drivesphere.com</p>
            <hr class="border-secondary">
            <p class="text-white-50">Business Hours: Mon-Sat, 10:00 AM - 7:00 PM</p>
        </div>

        <!-- 2. Form -->
        <div class="card">
            <h4>Send Us a Message</h4>
            <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                <div class="mb-4">
                    <input type="text" class="form-control" placeholder="Your Name" required>
                </div>
                <div class="mb-4">
                    <input type="email" class="form-control" placeholder="Your Email" required>
                </div>
                <div class="mb-4">
                    <textarea class="form-control" rows="5" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="btn btn-submit">Send Message</button>
            </form>
        </div>

    </div>

    <footer>
        <p>© 2026 DriveSphere. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
